# Describes the intended containerized shape of the delivery-stats
# extension: Kafka (KRaft, no ZooKeeper), ClickHouse, the Go gateway, and
# the React dashboard. Authored to document the target deployment; never
# built or run in this session (Docker was unavailable in this WSL2
# environment, see README "what this is, and is not"). Real, live Kafka and
# ClickHouse were instead stood up as native WSL2 processes for every
# measurement in this README.
version: "3.9"
services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1

  clickhouse:
    image: clickhouse/clickhouse-server:25.1
    ports:
      - "8123:8123"
      - "9000:9000"

  deliverygateway:
    build:
      context: ../
      dockerfile: deploy/deliverystats-gateway.Dockerfile
    depends_on:
      - kafka
      - clickhouse
    ports:
      - "8090:8090"
    command:
      [
        "-addr=0.0.0.0:8090",
        "-broker=kafka:9092",
        "-clickhouse=clickhouse:8123",
        "-clickhouse-db=deliverystats",
      ]

  deliverydashboard:
    build:
      context: ../
      dockerfile: deploy/deliverystats-dashboard.Dockerfile
    depends_on:
      - deliverygateway
    ports:
      - "8080:80"
